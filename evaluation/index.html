<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le test final · Form'Action IA</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#253238">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#253238;--ink2:#3a4950;--red:#E71715;--paper:#F3F3F5;--mist:#9aa5ab;--ok:#1f9d55}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:400 17px/1.45 Inter,system-ui,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:560px;min-height:100%;display:flex;flex-direction:column;padding:20px 20px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;height:40px}
.logo{font:400 26px/1 "Bebas Neue",sans-serif;letter-spacing:.01em}.logo b{color:var(--red);font-weight:400}
.count{font:600 13px Inter;color:var(--mist);font-variant-numeric:tabular-nums}
.bar{height:6px;background:#e1e3e6;margin:10px 0 0;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.screen{flex:1;display:flex;flex-direction:column;padding-top:28px;animation:in .45s cubic-bezier(.2,.8,.2,1) both}
.screen.back{animation-name:inb}
@keyframes in{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.eyebrow{font:600 13px Inter;color:var(--red);margin-bottom:10px}
h1{font:400 clamp(52px,15vw,84px)/.9 "Bebas Neue",sans-serif;margin-bottom:18px}
h1 span{color:var(--red)}
h2{font:400 clamp(30px,8.4vw,42px)/1 "Bebas Neue",sans-serif;margin-bottom:22px}
.lead{font-size:18px;color:var(--ink2);margin-bottom:24px}
.facts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:auto}
.facts span{background:#fff;padding:10px 14px;font:600 14px Inter}
.btn{appearance:none;border:0;background:var(--red);color:#fff;font:600 18px Inter;padding:18px 22px;width:100%;margin-top:28px;cursor:pointer;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.35;cursor:default}
.btn.dark{background:var(--ink)}
label{display:block;font:600 14px Inter;margin:0 0 8px}
input{width:100%;font:500 18px Inter;padding:16px;border:2px solid #dfe2e5;background:#fff;color:var(--ink);outline:none;margin-bottom:18px;border-radius:0}
input:focus{border-color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:#fff;border:2px solid transparent;padding:16px;font:500 16px/1.35 Inter;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s,transform .15s;animation:pop .4s cubic-bezier(.2,.8,.2,1) both}
.opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.opt:active{transform:scale(.985)}
.opt .l{flex:none;width:38px;height:38px;display:grid;place-items:center;background:var(--paper);font:400 24px/1 "Bebas Neue",sans-serif;transition:background .15s,color .15s}
.opt.sel{border-color:var(--ink)}.opt.sel .l{background:var(--red);color:#fff}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;min-height:44px}
.link{appearance:none;background:none;border:0;font:600 15px Inter;color:var(--ink2);padding:10px 0;cursor:pointer}
.link[hidden]{display:none}
.recap{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.recap button{display:flex;gap:12px;justify-content:space-between;align-items:center;background:#fff;border:0;padding:12px 14px;font:500 14px Inter;color:var(--ink);text-align:left;cursor:pointer}
.recap b{font:400 20px "Bebas Neue";color:var(--red);flex:none}
.recap em{font-style:normal;color:var(--ink2);flex:1}
.done{justify-content:center;text-align:center;align-items:center}
.check{width:96px;height:96px;background:var(--red);display:grid;place-items:center;margin-bottom:26px;animation:zoom .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes zoom{from{transform:scale(.3) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.check svg{width:52px;height:52px;stroke:#fff;stroke-width:3;fill:none;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .35s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.err{background:#fff;border-left:4px solid var(--red);padding:12px 14px;font:500 15px Inter;margin-top:16px}
.spin{width:28px;height:28px;border:3px solid #dfe2e5;border-top-color:var(--red);border-radius:50%;animation:r 0.8s linear infinite;margin:40px auto}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="logo">I<b>#</b>START · Form'Action IA</div><div class="count" id="count"></div></div>
  <div class="bar"><i id="bar"></i></div>
  <main id="view"><div class="spin"></div></main>
</div>
<script>
(function(){
var API="https://istart-evaluation.netlify.app/api/quiz";
var S=(new URLSearchParams(location.search).get("s")||"2026-12-04").replace(/[^0-9a-z-]/gi,"");
var LK="istart-eval-"+S, Q=[], st={step:-1,nom:"",entreprise:"",a:[],sent:false};
var view=document.getElementById("view"), bar=document.getElementById("bar"), cnt=document.getElementById("count");
function save(){try{localStorage.setItem(LK,JSON.stringify(st))}catch(e){}}
function load(){try{var x=JSON.parse(localStorage.getItem(LK)||"null");if(x&&x.a)st=x}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var L="ABCD", dir=1;
function go(n){dir=n>=st.step?1:-1;st.step=n;save();render()}
function render(){
  var n=Q.length, s=st.step, h="";
  var pct=s<1?0:Math.min(100,Math.round((Math.min(s,n))/n*100)); if(st.sent)pct=100;
  bar.style.width=pct+"%"; cnt.textContent=(s>=1&&s<=n&&!st.sent)?("Question "+s+" / "+n):"";
  if(st.sent){
    h='<section class="screen done"><div class="check"><svg viewBox="0 0 52 52"><path d="M12 27l9 9 19-20"/></svg></div><p class="eyebrow">C\'est envoyé</p><h2>Merci '+esc(st.nom.split(" ")[0])+' !</h2><p class="lead">On corrige ensemble dans un instant. Gardez cette page ouverte.</p></section>';
  }else if(s===-1){
    h='<section class="screen"><p class="eyebrow">Évaluation des acquis</p><h1>Le test <span>final</span></h1><p class="lead">Dix questions sur ce que vous avez vu aujourd\'hui. Une seule bonne réponse par question.</p><div class="facts"><span>10 questions</span><span>5 minutes</span><span>Corrigé ensemble</span></div><button class="btn" data-go="0">Commencer</button></section>';
  }else if(s===0){
    h='<section class="screen'+(dir<0?' back':'')+'"><p class="eyebrow">Avant de commencer</p><h2>Qui êtes-vous ?</h2><label for="nom">Nom et prénom</label><input id="nom" autocomplete="name" value="'+esc(st.nom)+'" placeholder="Marie Dupont"><label for="ent">Entreprise</label><input id="ent" autocomplete="organization" value="'+esc(st.entreprise)+'" placeholder="Votre entreprise"><p class="lead" style="font-size:15px">Votre résultat figure sur votre attestation de formation.</p><button class="btn" id="next0">C\'est parti</button></section>';
  }else if(s<=n){
    var q=Q[s-1];
    h='<section class="screen'+(dir<0?' back':'')+'"><p class="eyebrow">Question '+s+'</p><h2>'+esc(q.q)+'</h2><div class="opts">'+q.o.map(function(o,i){return '<button class="opt'+(st.a[s-1]===i?' sel':'')+'" data-a="'+i+'"><span class="l">'+L[i]+'</span><span>'+esc(o)+'</span></button>'}).join("")+'</div><div class="nav"><button class="link" data-go="'+(s-1)+'">← Précédente</button>'+(st.a[s-1]!=null?'<button class="link" data-go="'+(s+1)+'">Suivante →</button>':'')+'</div></section>';
  }else{
    var ok=st.a.length===n&&st.a.every(function(x){return x!=null});
    h='<section class="screen'+(dir<0?' back':'')+'"><p class="eyebrow">Dernière étape</p><h2>Vos réponses</h2><div class="recap">'+Q.map(function(q,i){return '<button data-go="'+(i+1)+'"><b>'+(i+1)+'</b><em>'+(st.a[i]!=null?esc(q.o[st.a[i]]):'<span style="color:var(--red)">Sans réponse</span>')+'</em><span>✎</span></button>'}).join("")+'</div><button class="btn" id="send"'+(ok?'':' disabled')+'>Envoyer mes réponses</button><div id="msg"></div></section>';
  }
  view.innerHTML=h; window.scrollTo(0,0);
  var b0=document.getElementById("next0");
  if(b0){var nm=document.getElementById("nom"),en=document.getElementById("ent");
    var chk=function(){b0.disabled=nm.value.trim().length<2};chk();nm.oninput=chk;
    b0.onclick=function(){st.nom=nm.value.trim();st.entreprise=en.value.trim();go(1)};}
  var sd=document.getElementById("send"); if(sd)sd.onclick=send;
}
view.addEventListener("click",function(e){
  var t=e.target.closest("[data-go],[data-a]"); if(!t)return;
  if(t.hasAttribute("data-a")){var s=st.step;st.a[s-1]=+t.getAttribute("data-a");save();
    view.querySelectorAll(".opt").forEach(function(o){o.classList.toggle("sel",o===t)});
    setTimeout(function(){if(st.step===s)go(s+1)},320);return;}
  go(+t.getAttribute("data-go"));
});
function send(){
  var b=document.getElementById("send"),m=document.getElementById("msg");b.disabled=true;b.textContent="Envoi…";
  fetch(API+"?s="+encodeURIComponent(S),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({nom:st.nom,entreprise:st.entreprise,answers:st.a})})
  .then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(){st.sent=true;save();render()})
  .catch(function(){b.disabled=false;b.textContent="Réessayer l'envoi";m.innerHTML='<p class="err">L\'envoi n\'a pas abouti. Vérifiez votre connexion et réessayez : vos réponses sont gardées.</p>'});
}
load();
fetch(API+"?s="+encodeURIComponent(S)).then(function(r){return r.json()}).then(function(d){Q=d.questions;render()})
.catch(function(){view.innerHTML='<p class="err">Impossible de charger le test. Vérifiez votre connexion puis rechargez la page.</p>'});
})();
</script>
</body>
</html>
