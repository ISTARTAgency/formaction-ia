<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Correction · Form'Action IA</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#253238;--ink2:#3a4950;--red:#E71715;--paper:#F3F3F5;--mist:#9aa5ab;--ok:#1f9d55}
*{box-sizing:border-box;margin:0}
body{background:var(--ink);color:#fff;font:400 18px/1.4 Inter,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;padding:3vh 5vw}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px}
.logo{font:400 30px/1 "Bebas Neue",sans-serif}.logo b{color:var(--red);font-weight:400}
.live{font:600 15px Inter;color:#cfd6da;display:flex;align-items:center;gap:10px}.live i{width:10px;height:10px;border-radius:50%;background:var(--red);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:3vh 0}
.eyebrow{font:600 15px Inter;color:var(--red);margin-bottom:12px}
h1{font:400 clamp(34px,4.6vw,66px)/1 "Bebas Neue",sans-serif;margin-bottom:4vh;max-width:24ch}
.rows{display:flex;flex-direction:column;gap:1.6vh}
.row{display:grid;grid-template-columns:52px 1fr 90px;gap:18px;align-items:center}
.l{width:52px;height:52px;display:grid;place-items:center;background:rgba(255,255,255,.08);font:400 30px "Bebas Neue"}
.track{position:relative;background:rgba(255,255,255,.07);min-height:64px;display:flex;align-items:center}
.fill{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.18);transition:width .7s cubic-bezier(.2,.8,.2,1),background .4s}
.txt{position:relative;padding:12px 18px;font:500 clamp(16px,1.5vw,22px)/1.3 Inter}
.n{font:400 40px/1 "Bebas Neue";text-align:right;font-variant-numeric:tabular-nums}
.reveal .row.good .fill{background:var(--ok)}.reveal .row.good .l{background:var(--ok)}
.reveal .row:not(.good){opacity:.45}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
button{appearance:none;border:0;font:600 16px Inter;padding:14px 22px;cursor:pointer;background:rgba(255,255,255,.1);color:#fff}
button.r{background:var(--red)}
.dots{display:flex;gap:6px}.dots i{width:22px;height:5px;background:rgba(255,255,255,.2)}.dots i.on{background:var(--red)}
table{width:100%;border-collapse:collapse;font-size:18px}td,th{padding:12px 10px;border-bottom:1px solid rgba(255,255,255,.12);text-align:left}th{font:600 14px Inter;color:#cfd6da}
td.s{font:400 32px "Bebas Neue";text-align:right}
.err{background:#fff;color:var(--ink);padding:16px;border-left:5px solid var(--red)}
</style>
</head>
<body>
<div class="top"><div class="logo">I<b>#</b>START · Correction du test final</div><div class="live"><i></i><span id="nb">…</span></div></div>
<main id="view"></main>
<div class="bottom"><div><button id="prev">← Précédente</button> <button id="next">Suivante →</button></div><div class="dots" id="dots"></div><div><button class="r" id="rev">Afficher la réponse</button> <button id="sc">Scores</button></div></div>
<script>
(function(){
var p=new URLSearchParams(location.search),K=p.get("k")||"",S=(p.get("s")||"2026-12-04").replace(/[^0-9a-z-]/gi,"");
var API="https://istart-evaluation.netlify.app/api/quiz?s="+encodeURIComponent(S)+"&k="+encodeURIComponent(K);
var D=null,i=0,rev=false,scores=false,view=document.getElementById("view");
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function draw(){
  if(!D)return; var it=D.items; document.getElementById("nb").textContent=it.length+" réponse"+(it.length>1?"s":"")+" reçue"+(it.length>1?"s":"");
  document.getElementById("dots").innerHTML=D.questions.map(function(_,k){return '<i class="'+(k===i&&!scores?'on':'')+'"></i>'}).join("");
  document.getElementById("rev").textContent=rev?"Masquer la réponse":"Afficher la réponse";
  if(scores){var r=it.slice().sort(function(a,b){return a.nom.localeCompare(b.nom)});
    view.innerHTML='<p class="eyebrow">Réservé aux formateurs</p><h1>Scores</h1><table><tr><th>Participant</th><th>Entreprise</th><th style="text-align:right">Score</th></tr>'+r.map(function(x){return '<tr><td>'+esc(x.nom)+'</td><td>'+esc(x.entreprise)+'</td><td class="s">'+x.score+' / 10</td></tr>'}).join("")+'</table>';return;}
  var q=D.questions[i],c=[0,0,0,0];it.forEach(function(x){c[x.answers[i]]++});var tot=it.length||1;
  var ex=view.querySelector('[data-q="'+i+'"]');
  if(!ex){view.innerHTML='<div data-q="'+i+'" class="'+(rev?'reveal':'')+'"><p class="eyebrow">Question '+(i+1)+' / '+D.questions.length+'</p><h1>'+esc(q.q)+'</h1><div class="rows">'+q.o.map(function(o,k){return '<div class="row'+(k===q.c?' good':'')+'"><span class="l">'+"ABCD"[k]+'</span><div class="track"><div class="fill" style="width:0"></div><span class="txt">'+esc(o)+'</span></div><span class="n">0</span></div>'}).join("")+'</div></div>';ex=view.firstChild;}
  ex.className=rev?"reveal":"";
  ex.querySelectorAll(".row").forEach(function(r,k){r.querySelector(".fill").style.width=(c[k]/tot*100)+"%";r.querySelector(".n").textContent=c[k]});
}
function pull(){fetch(API,{cache:"no-store"}).then(function(r){if(!r.ok)throw r.status;return r.json()}).then(function(d){if(!d.items)throw 403;D=d;draw()})
 .catch(function(e){view.innerHTML='<p class="err">'+(e===403?'Lien de correction invalide.':'Connexion impossible, nouvel essai dans quelques secondes.')+'</p>'})}
function nav(d){if(!D)return;scores=false;i=Math.max(0,Math.min(D.questions.length-1,i+d));rev=false;view.innerHTML="";draw()}
document.getElementById("prev").onclick=function(){nav(-1)};document.getElementById("next").onclick=function(){nav(1)};
document.getElementById("rev").onclick=function(){if(scores)return;rev=!rev;draw()};
document.getElementById("sc").onclick=function(){scores=!scores;view.innerHTML="";draw()};
document.addEventListener("keydown",function(e){if(e.key==="ArrowRight")nav(1);if(e.key==="ArrowLeft")nav(-1);if(e.key===" "){e.preventDefault();rev=!rev;draw()}});
pull();setInterval(pull,3000);
})();
</script>
</body>
</html>
